<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业智能问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center; padding: 30px 0 20px;
        }
        header h1 { color: #1a73e8; font-size: 28px; margin-bottom: 8px; }
        header p { color: #666; font-size: 14px; }
        .card {
            background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px; margin-bottom: 20px;
        }
        .input-area { display: flex; gap: 12px; }
        .input-area input {
            flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button {
            padding: 12px 28px; background: #1a73e8; color: #fff; border: none;
            border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover { background: #1557b0; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .quick-qs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .quick-qs button {
            padding: 6px 14px; background: #e8f0fe; color: #1a73e8; border: 1px solid #c4d7f2;
            border-radius: 16px; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .quick-qs button:hover { background: #d0e1fd; }
        .result { display: none; }
        .result .answer {
            background: #fafafa; border-radius: 8px; padding: 16px; margin-bottom: 12px;
            white-space: pre-wrap; line-height: 1.7; font-size: 14px; border: 1px solid #eee;
        }
        .result .sources {
            font-size: 13px; color: #888;
        }
        .result .sources .source-item {
            padding: 6px 0; border-bottom: 1px solid #f0f0f0;
        }
        .result .sources .source-item:last-child { border-bottom: none; }
        .loading { text-align: center; padding: 20px; color: #999; display: none; }
        .error { color: #d32f2f; background: #ffebee; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
        .stats { display: flex; gap: 20px; justify-content: center; margin-top: 12px; }
        .stat { text-align: center; }
        .stat .num { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .stat .label { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>企业智能问答助手</h1>
            <p>查询员工信息 · 项目记录 · 考勤数据 · 公司制度 · 会议纪要</p>
        </header>

        <div class="card" id="stats-card">
            <div class="stats">
                <div class="stat"><div class="num" id="stat-emp">-</div><div class="label">在职员工</div></div>
                <div class="stat"><div class="num" id="stat-proj">-</div><div class="label">项目数</div></div>
                <div class="stat"><div class="num" id="stat-kb">-</div><div class="label">知识文档</div></div>
            </div>
        </div>

        <div class="card">
            <div class="input-area">
                <input type="text" id="question" placeholder="输入您的问题，如：张三的部门是什么？年假怎么算？" autofocus>
                <button id="ask-btn" onclick="askQuestion()">查询</button>
            </div>
            <div class="quick-qs">
                <button onclick="quickAsk('张三的部门是什么？')">张三的部门？</button>
                <button onclick="quickAsk('年假怎么计算？')">年假怎么算？</button>
                <button onclick="quickAsk('王五符合晋升条件吗？')">王五晋升条件</button>
                <button onclick="quickAsk('张三负责哪些项目？')">张三的项目</button>
                <button onclick="quickAsk('研发部有多少人？')">研发部人数</button>
                <button onclick="quickAsk('张三2月迟到几次？')">张三迟到</button>
                <button onclick="quickAsk('李四的上级是谁？')">李四上级</button>
                <button onclick="quickAsk('有哪些在研项目？')">在研项目</button>
            </div>
        </div>

        <div class="loading" id="loading">正在查询中...</div>
        <div class="error" id="error"></div>
        <div class="card result" id="result">
            <div class="answer" id="answer-text"></div>
            <div class="sources" id="sources"></div>
        </div>
    </div>

    <script>
        const API = '/api/v1/qa';

        async function askQuestion() {
            const q = document.getElementById('question').value.trim();
            if (!q) return;
            await doQuery(q);
        }

        async function quickAsk(q) {
            document.getElementById('question').value = q;
            await doQuery(q);
        }

        async function doQuery(q) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const answer = document.getElementById('answer-text');
            const sources = document.getElementById('sources');
            const btn = document.getElementById('ask-btn');

            loading.style.display = 'block';
            error.style.display = 'none';
            result.style.display = 'none';
            btn.disabled = true;

            try {
                const resp = await fetch(API + '/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q }),
                });
                const json = await resp.json();

                if (json.status === 200 && json.data) {
                    answer.textContent = json.data.answer;
                    sources.innerHTML = '';
                    if (json.data.sources && json.data.sources.length > 0) {
                        sources.innerHTML = '<strong>信息来源：</strong>';
                        json.data.sources.forEach(s => {
                            const div = document.createElement('div');
                            div.className = 'source-item';
                            div.innerHTML = `<span>[${
                                s.type === 'database' ? '数据库' : '知识库'
                            }] ${s.detail}</span>`;
                            sources.appendChild(div);
                        });
                    }
                    result.style.display = 'block';
                } else {
                    error.textContent = json.message || '查询失败';
                    error.style.display = 'block';
                }
            } catch (e) {
                error.textContent = '网络请求失败：' + e.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        async function loadStats() {
            try {
                const resp = await fetch(API + '/health');
                const json = await resp.json();
                if (json.status === 200 && json.data) {
                    document.getElementById('stat-emp').textContent = json.data.employee_count || '-';
                    document.getElementById('stat-proj').textContent = '-';
                    document.getElementById('stat-kb').textContent = json.data.kb_sections || '-';
                }
            } catch (e) { /* ignore */ }
        }

        document.getElementById('question').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') askQuestion();
        });

        loadStats();
    </script>
</body>
</html>
